services:
  db:
    image: postgres:16-alpine
    container_name: erpbusiness-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_business
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_business"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  erp_pgdata:
